logging:
  level:
    root: DEBUG
  pattern:
    level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:mysql://localhost:3306/ritesh_db
    username: root
    password: admin

server:
  port: 8081

service:
  address-service:
    url: http://localhost:8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

config-refresh-message: "Config Refresh Done 01"
environment-value: "dev"

resilience4j:
  circuitBreaker:
    instances:
      address-service-cb:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # capture 100% of requests in dev
    otlp:
      tracing:
        endpoint: http://localhost:4318/v1/traces   # Jaeger OTLP HTTP endpoint
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans